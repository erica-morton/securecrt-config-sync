name: Test SecureCRT config sync

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS integration
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate shell scripts
        run: |
          bash -n setup-onedrive-macos.sh
          bash -n disconnect-onedrive-macos.sh
          bash -n tests/test-securecrt-setup-macos.sh

      - name: Test macOS setup
        run: tests/test-securecrt-setup-macos.sh

  windows:
    name: Windows integration
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module `
            -Name PSScriptAnalyzer `
            -RequiredVersion 1.25.0 `
            -Scope CurrentUser `
            -Repository PSGallery `
            -Force

      - name: Analyze PowerShell
        shell: powershell
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $results = @(
            Invoke-ScriptAnalyzer `
              -Path . `
              -Settings .\PSScriptAnalyzerSettings.psd1 `
              -Recurse
          )
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($results.Count) finding(s)."
          }

      - name: Test Windows setup
        shell: powershell
        run: .\tests\test-securecrt-setup-windows.ps1
